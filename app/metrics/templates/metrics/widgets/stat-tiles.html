{% comment %}
A StatGroup with style "tiles": compact version of stat-row.html, with
smaller numbers and an orange top border.
{% endcomment %}
{% if widget %}
<div class="tmd-widget" id="{{ widget.id }}">
    {% include 'metrics/widgets/header.html' %}
    <div class="tmd-stat-grid tmd-stat-grid-tiles">
        {% for stat in widget.stats %}
        <div class="tmd-stat-tile rounded-bottom p-3 d-flex flex-column gap-1">
            <span class="fs-2 fw-bold lh-1">{{ stat.value }}</span>
            <span>{{ stat.label }}</span>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
