{% comment %}
Bars: one thin bar per group, with the label on the left and the percentage
on the right.
{% endcomment %}
{% if widget %}
<div class="tmd-widget" id="{{ widget.id }}">
    {% include 'metrics/widgets/header.html' %}
    <div class="d-flex flex-column gap-2">
        {% for bar in widget.bars %}
        <div>
            <div class="d-flex justify-content-between gap-2">
                <span>{{ bar.label }}</span>
                <strong>{{ bar.text }}</strong>
            </div>
            <div class="progress" role="progressbar" aria-label="{{ bar.label }}"
                 aria-valuenow="{{ bar.percent|floatformat:0 }}" aria-valuemin="0" aria-valuemax="100"
                 style="height: 0.75rem">
                <div class="progress-bar tmd-bar" style="width: {{ bar.percent|floatformat:'2u' }}%"></div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
