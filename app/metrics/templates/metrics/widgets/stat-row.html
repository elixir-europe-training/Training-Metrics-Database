{% if stats %}
<div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3">
    {% for stat in stats %}
    <div class="col">
        <div class="card h-100">
            <div class="card-body d-flex flex-column gap-1">
                <span class="fs-1 fw-bold lh-1">{{ stat.value }}</span>
                <span class="fs-6 text-body-secondary">{{ stat.label }}</span>
                {% if stat.note %}<span class="small text-body-tertiary">{{ stat.note }}</span>{% endif %}
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
