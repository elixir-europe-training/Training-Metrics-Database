{% load static %}

{% block content %}
  <h1 class="mb-3">Training Metrics Widget</h1>
  <p class="text-muted">
    This page renders the widget using the public quality question set endpoint. Use it to verify
    behaviour while developing locally.
  </p>

  <div class="tmd-widget" id="tmd-widget-container"></div>

  <script src="{{ widget_script_url }}"></script>
  <script>
    TMDWidget({
      container: '#tmd-widget-container',
      questions: ['quality-course_rating', 'impact-followup_shared'],
      chartType: 'pie',
      colors: ['#f47d20', '#005472', '#7fb800', '#ffd400'],
      endpoint: 'http://localhost:8001/metrics'
    }).catch((error) => {
      console.error('TMDWidget failed to initialise', error);
    });
  </script>
{% endblock %}
