<li class="nav-item">
    {% if item.use_post %}
    <form action="{{ item.url }}" method="post">
        {% csrf_token %}
        <button type="submit" class="nav-link"><i class="bi bi-{{ item.icon }} me-2"></i>{{ item.title }}</button>
    </form>
    {% else %}
    <a class="nav-link" href="{{ item.url }}"><i class="bi bi-{{ item.icon }} me-2"></i>{{ item.title }}</a>
    {% endif %}
</li>
