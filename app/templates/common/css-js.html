{% load static %}

<link href="{% static 'vendor/bootstrap.min.css' %}" rel="stylesheet" />
<link rel="stylesheet" href="{% static 'vendor/bootstrap-icons.css' %}" />
<script src="{% static 'vendor/bootstrap.bundle.min.js' %}"></script>


<style>
  /* css file for TMD */
  body {
    color: #353535;
    font-family: arial, sans-serif;
    font-size: 14px;

    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100%;
  }

  body,
  [data-bs-theme="dark"],
  [data-bs-theme="light"] {
    --bs-link-color-rgb: 229, 131, 58;
    --bs-link-hover-color-rgb: 160, 79, 18;
    --bs-link-active-color-rgb: 160, 79, 18;
    --bs-link-visited-color-rgb: 229, 131, 58;
    --bs-link-opacity: 1;
    --bs-bg-opacity: 1;
  }

  h1 {
    font-size: 35px;
    font-weight: normal;
    color: #e5833a;
    margin-top: 5px;
  }

  .divider {
    border-bottom: solid 1px var(--bs-navbar-color);
  }

  nav {
    flex-grow: 0;
    flex-shrink: 0;
  }

  .main-content {
    flex-grow: 1;
    flex-shrink: 1;
  }

  footer {
    flex-grow: 0;
    flex-shrink: 0;
    color: var(--bs-body-color);
    background-color: rgba(var(--bs-dark-rgb), var(--bs-bg-opacity));
  }

  .DateInput_input {
    font-size: 14px;
  }

  .table-container {
    max-height: calc(10 * 38px);
    overflow: auto;
    margin-bottom: 1rem;
  }
  .table-container > table {
    margin-bottom: 0;
  }
  .table-container > table th {
    position: sticky;
    top: 0;
    z-index: 1;
  }

  .value-inspector {
    position: relative;
  }

  .value-inspector > .status-badge:hover ~ .content {
    visibility: visible;
    opacity: 100%;
  }

  .status-badge:hover {
    opacity: 90%;
  }

  .value-inspector > .content {
    box-sizing: border-box;
    position: absolute;
    visibility: hidden;
    pointer-events: none;
    opacity: 0;
    top: calc(100% + 0.5rem);
    left: calc(-0.5rem - 1px);
    padding: 0.5rem;
    background: white;
    border-radius: 0.5rem;
    z-index: 1000;
    transition: opacity 0.2s;
    border: solid 1px rgba(0, 0, 0, 0.5);
  }

  .value-inspector > .content[data-has-error="true"] {
    min-width: calc(min(20rem, 100vw) - 24px);
    max-width: 100vw;
  }
</style>
